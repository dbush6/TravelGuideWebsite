<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Contact — First-Time Travel Guide</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="images/favicon_io (3)/favicon.ico">
</head>
<body>
    <header>
        <div class="container header header-grid">
        <a href="index.html" class="logo">
            <img src="images/travel-guide-logo.png" alt="First-Time Travel Guide Logo">
        </a>
        <form class="header-search" role="search" aria-label="Site search" action="#" method="get">
            <input class="input" type="search" name="q" placeholder="Search travel topics…" aria-label="Search">
        </form>
        <a class="hamburger" href="#menu" aria-label="Open menu"><span></span><span></span><span></span></a>
        <nav class="main-nav" aria-label="Primary">
            <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="passport.html">Passport</a></li>
            <li><a href="packing.html">Packing</a></li>
            <li><a href="seasonal.html">Seasonal</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
        </div>
    </header>

    <div id="menu" class="menu-panel" aria-label="Mobile menu">
        <div class="menu-panel__inner">
        <a href="#" class="menu-close" aria-label="Close menu">×</a>
        <nav aria-label="Primary mobile">
            <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="passport.html">Passport</a></li>
            <li><a href="packing.html">Packing</a></li>
            <li><a href="seasonal.html">Seasonal</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
        </div>
    </div>

    <main class="container">
        <section class="time">
        <h1>Contact</h1>
        <p>Questions or feedback? Send a message.</p>
        </section>

        <section class="start contact-form">
            <form id="contactForm">
                <label for="name">Name</label>
                <input id="name" class="input" type="text" required>
            
                <label for="email">Email</label>
                <input id="email" class="input" type="email" required>
            
                <label for="msg">Message</label>
                <textarea id="msg" required></textarea>
            
                <p><button class="btn" type="submit">Submit</button></p>
            </form>
          
            <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
          </section>
    </main>

    <footer class="footer">
        <div class="container">
        <div class="social">
            <a href="#" aria-label="Facebook"><ion-icon name="logo-facebook"></ion-icon></a>
            <a href="#" aria-label="Twitter"><ion-icon name="logo-twitter"></ion-icon></a>
            <a href="#" aria-label="Instagram"><ion-icon name="logo-instagram"></ion-icon></a>
            <a href="#" aria-label="YouTube"><ion-icon name="logo-youtube"></ion-icon></a>
        </div>
        <p>© 2025 First-Time Travel Guide. All Rights Reserved.</p>
        </div>
    </footer>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("contactForm");
        const msgBox = document.getElementById("formMessage");
        
        form.addEventListener("submit", (e) => {
            e.preventDefault();
            form.reset();
            msgBox.textContent = "We thank you for your message and will be in touch soon.";
            msgBox.classList.add("show");
        
            setTimeout(() => {
            msgBox.textContent = "";
            msgBox.classList.remove("show");
            }, 5000);
        });
        });
    </script>
</body>
</html>
